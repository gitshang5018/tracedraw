[package]
name = "tracedraw-android"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "TraceDraw for Android: the editor on a phone screen"

[lib]
name = "tracedraw_android"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
tracedraw = { path = "../tracedraw" }
log.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }

[package.metadata.android]
package = "dev.tracedraw.app"
apk_name = "tracedraw"
resources = "res"
build_targets = ["aarch64-linux-android", "x86_64-linux-android", "armv7-linux-androideabi"]

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

# Drawings live in the phone's own storage, where a file manager reaches
# them: Android 11 and later grant that with "all files access", which the
# Files sheet asks for; older systems ask for the storage permission.
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

# Help > Updates downloads a new APK and hands it to the system's installer
# (the user allows it for TraceDraw on a screen of the system's the first
# time).
[[package.metadata.android.uses_permission]]
name = "android.permission.REQUEST_INSTALL_PACKAGES"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29

[package.metadata.android.application]
label = "TraceDraw"
icon = "@mipmap/ic_launcher"
theme = "@style/Theme.TraceDraw"
extract_native_libs = true
resizeable_activity = true

# Max aspect ratio so modern 20:9 / 21:9 displays do not get letterboxed
[[package.metadata.android.application.meta_data]]
name = "android.max_aspect"
value = "2.6"

# Xiaomi / MIUI / HyperOS: allow drawing into the cutout/notch area in landscape
[[package.metadata.android.application.meta_data]]
name = "notch.config"
value = "portrait|landscape"

# Huawei / Honor: declare notch support to prevent letterboxing
[[package.metadata.android.application.meta_data]]
name = "android.notch_support"
value = "true"

[package.metadata.android.application.activity]
theme = "@style/Theme.TraceDraw"
orientation = "fullUser"
resizeable_activity = true
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|smallestScreenSize|density|uiMode|fontScale|locale|layoutDirection"

# A drawing tapped in a file manager opens in TraceDraw: `.cdr` and
# `.tdraw` as a path (the systems before Android 7 hand a file over that
# way), and the content types a file manager sends for them. Each data
# element has a filter of its own: Android joins the data elements of one
# filter with "and".
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW"]
categories = ["android.intent.category.DEFAULT"]

[[package.metadata.android.application.activity.intent_filter.data]]
scheme = "file"
path_pattern = ".*\\.cdr"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW"]
categories = ["android.intent.category.DEFAULT"]

[[package.metadata.android.application.activity.intent_filter.data]]
scheme = "file"
path_pattern = ".*\\.tdraw"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW"]
categories = ["android.intent.category.DEFAULT"]

[[package.metadata.android.application.activity.intent_filter.data]]
scheme = "content"
mime_type = "image/vnd.corel-draw"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW"]
categories = ["android.intent.category.DEFAULT"]

[[package.metadata.android.application.activity.intent_filter.data]]
scheme = "content"
mime_type = "application/x-cdr"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW"]
categories = ["android.intent.category.DEFAULT"]

[[package.metadata.android.application.activity.intent_filter.data]]
scheme = "content"
mime_type = "image/x-cdr"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW"]
categories = ["android.intent.category.DEFAULT"]

[[package.metadata.android.application.activity.intent_filter.data]]
scheme = "content"
mime_type = "application/x-tdraw"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW"]
categories = ["android.intent.category.DEFAULT"]

[[package.metadata.android.application.activity.intent_filter.data]]
scheme = "content"
mime_type = "application/vnd.tracedraw"
