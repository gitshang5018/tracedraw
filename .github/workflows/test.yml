name: test

# The gate `AGENTS.md` asks for: the tests of every crate and the lint of the
# library ones. Nothing here is shipped, so a run that fails changes nothing
# on the update host; the APK is `android.yml`'s.
#
# This replaces the test job that went with the desktop workflow (now
# `build.yml.disabled`, since only the Android APK is published here): that
# job ran `cargo test --workspace --exclude tracedraw`, which left the
# application crate, and with it the update check and the phone's installer,
# outside CI altogether.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch at a time: a newer push cancels the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned so the lint set matches what contributors run locally; bump
      # it together with the version noted in AGENTS.md.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The application crate links the window system and shapes text, so it
      # needs the same libraries and fonts the desktop build does, or its
      # tests do not even build on a bare runner. Xvfb stands in for a
      # screen, as the visual scripts do.
      - name: The libraries the desktop build needs
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libgl1-mesa-dri libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgtk-3-dev xvfb \
            fonts-liberation fonts-dejavu-core fonts-noto-core
      # Every crate, the application one included, and no stopping at the
      # first failing binary: the whole list is what says where to look.
      - name: Test
        run: |
          set -o pipefail
          xvfb-run -a cargo test --workspace --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/test.log"
      # A failing run has to name the tests that failed in the run's own
      # annotations and summary: the log itself asks for a signed-in reader,
      # and the annotation is what a reader of the API sees.
      - name: What failed
        if: failure()
        run: |
          {
            echo "### The tests that failed"
            echo '```'
            grep -E "^test .* FAILED$|^failures:$|panicked|^error(\[|:)" "$RUNNER_TEMP/test.log" | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^test .* FAILED$" "$RUNNER_TEMP/test.log" | head -10 | sed 's/^/::error::/' || true
          grep -E "^error(\[|:)" "$RUNNER_TEMP/test.log" | head -5 | sed 's/^/::error::/' || true
          grep -E "panicked" "$RUNNER_TEMP/test.log" | head -5 | sed 's/^/::error::/' || true
      # The application crate carries warnings of its own (an unread field, a
      # `mut` it does not need), so the lint gate stays on the library crates,
      # as AGENTS.md describes.
      - name: Lint
        if: success()
        run: cargo clippy --workspace --exclude tracedraw -- -D warnings
