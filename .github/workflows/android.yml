name: android

# The Android APK: built on every push to main, on a version tag, and when
# run by hand. A tag (or a version asked for by hand) publishes the APKs in
# that release; a push to main refreshes the "nightly" pre-release, as the
# desktop workflow does with the installers.
on:
  push:
    branches: [main]
    tags: ["v*"]
  # Run by hand (Actions > android > Run workflow): with a version, the run
  # makes the tag and the release itself, with the APKs attached.
  workflow_dispatch:
    inputs:
      release:
        description: "Version to release, like 0.3.0 (empty: build only)"
        required: false
        default: ""

# One run per branch or tag at a time: a newer push to main cancels the run
# still going, so two runs never replace the nightly release at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # The NDK the APK is built against (the one the release notes name).
  NDK_VERSION: 27.0.12077973
  # The tag this run releases ("v0.3.0"): a version tag pushed, or the
  # version asked for when run by hand; empty for every other run.
  RELEASE_TAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.release != '') && format('v{0}', inputs.release) || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}

jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      # How the APK was signed, for the notes of the release.
      signed: ${{ steps.key.outputs.signed }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The phones, then the emulators.
          - target: aarch64-linux-android
            abi: arm64-v8a
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
          - target: x86_64-linux-android
            abi: x86_64
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.target }}

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            # The workspace version from Cargo.toml, then the commit.
            base=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
            echo "version=${base}-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # The runners carry the Android SDK but not every NDK: the one the
      # build asks for is fetched here. The download is taken from the
      # release page rather than sdkmanager, which gives up early on a slow
      # link ("Premature EOF").
      - name: NDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [[ ! -d "$ndk" ]]; then
            # r27 is 27.0.12077973; the archive holds android-ndk-r27/.
            r="${NDK_VERSION%%.*}"
            zip="android-ndk-r${r}-linux.zip"
            mkdir -p "$ANDROID_HOME/ndk"
            for i in 1 2 3; do
              echo "Downloading $zip (try $i)"
              if curl -sSfL --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/$zip" \
                  "https://dl.google.com/android/repository/$zip"; then
                break
              fi
              sleep 10
            done
            unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP/ndk"
            mv "$RUNNER_TEMP/ndk/android-ndk-r${r}" "$ndk"
          fi
          cat "$ndk/source.properties"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      # cargo-apk takes the android.jar of the target SDK the manifest
      # asks for (34): the runner keeps several, this makes sure of that
      # one.
      - name: SDK platform
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [[ ! -d "$ANDROID_HOME/platforms/android-34" ]]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              --sdk_root="$ANDROID_HOME" --install "platforms;android-34" || true
          fi
          ls "$ANDROID_HOME/platforms"

      - name: cargo-apk
        run: cargo install cargo-apk --locked
      # A version release is signed with the repository's own key, which
      # lives in its secrets (ANDROID_KEYSTORE_BASE64, a base64 of the
      # .jks, and ANDROID_KEYSTORE_PASSWORD): an APK signed with another
      # key cannot replace an installed one, so a release without it stops
      # here. A nightly is signed with a key made for the run when the
      # secrets are not there yet, which is enough to try a build.
      - name: Signing key
        id: key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE: ${{ env.RELEASE_TAG != '' }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/release.keystore"
          if [[ -n "${KEYSTORE_BASE64:-}" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
            if [[ -z "${KEYSTORE_PASSWORD:-}" ]]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is set but ANDROID_KEYSTORE_PASSWORD is not."
              exit 1
            fi
            echo "signed=the release key" >> "$GITHUB_OUTPUT"
            echo "Signed with the repository's release key."
          elif [[ "$RELEASE" == "true" ]]; then
            echo "::error::A version release is signed with the release key: add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD to Settings > Secrets and variables > Actions."
            exit 1
          else
            keytool -genkeypair -keystore "$keystore" -alias tracedraw \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=TraceDraw, O=TraceDraw, C=US"
            KEYSTORE_PASSWORD=android
            echo "signed=a key made for this run" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this nightly is signed with a key made for the run, which cannot replace an installed build."
          fi
          {
            echo "CARGO_APK_RELEASE_KEYSTORE=$keystore"
            echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build
        # The version this build reports to Help > Updates: the release tag
        # it is made from, or the commit of a development build. The crate
        # version alone cannot tell two builds of 0.19.8 apart.
        env:
          TRACEDRAW_BUILD_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cargo apk build --manifest-path apps/tracedraw-android/Cargo.toml --lib \
            --release --target ${{ matrix.target }}

      - name: Name the APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # cargo-apk writes it beside the profile, not under the triple.
          src=""
          for p in "target/release/apk/tracedraw.apk" \
                   "target/${{ matrix.target }}/release/apk/tracedraw.apk"; do
            if [[ -f "$p" ]]; then src="$p"; break; fi
          done
          if [[ -z "$src" ]]; then
            echo "No APK was packed:"
            find target -name '*.apk' | head
            exit 1
          fi
          out="dist/tracedraw-${{ steps.ver.outputs.version }}-android-${{ matrix.abi }}.apk"
          cp "$src" "$out"
          ls -l "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: tracedraw-android-${{ matrix.abi }}
          path: dist/*.apk
          if-no-files-found: error

  # Version tags publish a release; every push to main refreshes the
  # "nightly" pre-release with the APKs of that commit. The release and its
  # notes are the desktop workflow's (build.yml); this job only adds the
  # APKs to it, and makes it when it is not there yet.
  release:
    if: (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')) || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The changelog, for the notes of a version, and the page the
          # update host serves beside the APKs.
          sparse-checkout: |
            CHANGELOG.md
            edgeone/index.html
            edgeone/package.json
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: The APKs
        run: ls -l artifacts

      # The app downloads a phone's APK from the update host on EdgeOne's
      # edge network (see `edgeone/`), which reaches phones that cannot
      # download from GitHub at all. The APKs go out as the site's own
      # files: a function cannot hand over 25 MB (Edge Functions answer in
      # 200 ms of CPU, Cloud Functions cap a response at 6 MB), while a
      # static file is served by the CDN and has no such limit beyond the
      # 25 MiB a single asset may have. The one over that stays on the
      # release, where the app still finds it. Without the token nothing is
      # deployed and every phone falls back to the release, so this step
      # never blocks a release.
      - name: Update host
        continue-on-error: true
        env:
          EDGEONE_TOKEN: ${{ secrets.EDGEONE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${EDGEONE_TOKEN:-}" ]]; then
            echo "No EDGEONE_TOKEN: the APKs stay on the release only."
            exit 0
          fi
          mkdir -p dist/apk
          cp edgeone/index.html edgeone/package.json dist/
          limit=$((25 * 1024 * 1024))
          for apk in artifacts/*.apk; do
            size=$(stat -c%s "$apk")
            if (( size <= limit )); then
              cp "$apk" dist/apk/
            else
              echo "::warning::$apk is $size bytes, over the 25 MiB a site file may have: it stays on the release."
            fi
          done
          ls -l dist/apk
          # The manifest the app reads: the version, and each file with the
          # digest it was published with. The version is in the file names.
          version=$(basename "$(ls dist/apk/*.apk | head -1)")
          version=${version#tracedraw-}
          version=${version%-android-*}
          {
            printf '{\n  "version": "%s",\n  "built": %s,\n  "page": "https://github.com/%s/releases",\n  "assets": [\n' \
              "$version" "$(date +%s)" "${{ github.repository }}"
            first=1
            for apk in dist/apk/*.apk; do
              if (( first )); then first=0; else printf ',\n'; fi
              printf '    {"name": "%s", "size": %s, "sha256": "%s"}' \
                "$(basename "$apk")" "$(stat -c%s "$apk")" "$(sha256sum "$apk" | cut -d' ' -f1)"
            done
            printf '\n  ]\n}\n'
          } > dist/update.json
          cat dist/update.json
          # A deployment now and then comes back "Failed Operation" while
          # the one before is still settling: it is asked again, and a host
          # that stays behind is said out loud, since a stale manifest makes
          # every phone offer the build before this one.
          deployed=0
          for attempt in 1 2 3; do
            if npx -y edgeone@latest makers deploy ./dist -n tracedraw -t "$EDGEONE_TOKEN"; then
              deployed=1
              break
            fi
            echo "::warning::the update host did not take the deployment (attempt $attempt)"
            sleep 20
          done
          if (( ! deployed )); then
            echo "::warning::the update host is behind: the app keeps offering the release until it is deployed again"
          fi

      # The nightly keeps the name "nightly" while the APK names carry the
      # commit: the ones of the run before are dropped, or they pile up.
      - name: The APKs of the nightly before
        if: env.RELEASE_TAG == ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          old=$(gh release view nightly --repo "${{ github.repository }}" \
                  --json assets --jq '.assets[].name' 2>/dev/null || true)
          for asset in $(printf '%s\n' "$old" | grep -E '^tracedraw-.*-android-.*[.]apk$' || true); do
            echo "Replacing $asset"
            gh release delete-asset nightly "$asset" --repo "${{ github.repository }}" --yes || true
          done

      - name: Notes
        shell: bash
        env:
          SIGNED: ${{ needs.apk.outputs.signed }}
        run: |
          # The notes are in Chinese: the phones this build is for read
          # them, and the app's own update box opens this page.
          if [[ -n "$RELEASE_TAG" ]]; then
            # The version's section of CHANGELOG.md ("## 0.3.0 (date)").
            v="${RELEASE_TAG#v}"
            awk -v head="## ${v} " 'index($0, head) == 1 { p = 1; next } /^## / && p { exit } p' \
              CHANGELOG.md > release-notes.md
          else
            {
              echo "Android 版，由 \`main\` 分支的 ${GITHUB_SHA:0:7} 构建，每次推送都会替换这个包。"
              echo
              echo "在 App 里打开菜单 > 检查更新，就能直接下载安装；也可以点下面的 APK 手动装。"
            } > release-notes.md
          fi
          cat >> release-notes.md <<'NOTES'

          ### 安装包

          | 文件 | 适用机型 |
          | --- | --- |
          | `tracedraw-*-arm64-v8a.apk` | 64 位手机（绝大多数） |
          | `tracedraw-*-armeabi-v7a.apk` | 老的 32 位手机 |
          | `tracedraw-*-x86_64.apk` | 模拟器 |

          在文件管理器里点开 `.cdr` 或 `.tdraw` 图纸，就能用 TraceDraw 打开。
          NOTES
          if [[ "$SIGNED" == "the release key" ]]; then
            echo "" >> release-notes.md
            echo "已用项目发布密钥签名：可以直接覆盖安装旧版本。" >> release-notes.md
          else
            echo "" >> release-notes.md
            echo "使用本次构建临时生成的密钥签名：安装前请先卸载旧版本。" >> release-notes.md
          fi
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          tag_name: ${{ env.RELEASE_TAG != '' && env.RELEASE_TAG || 'nightly' }}
          name: ${{ env.RELEASE_TAG != '' && env.RELEASE_TAG || 'nightly' }}
          prerelease: ${{ env.RELEASE_TAG == '' }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
